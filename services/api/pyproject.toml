[project]
name = "hackumass-learning-api"
version = "0.1.0"
description = "Shared API, adaptive feed, quizzes, and durable job infrastructure"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pydantic-settings>=2.6,<3",
  "pymongo==4.15.5",
  "uvicorn>=0.32,<1",
  "python-dotenv==1.2.4",
  "instagrapi==3.2.12",
  "pycryptodomex==3.24.2",
  "pypdf==7.1.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/core/tests", "app/modules/recommendations/tests", "app/modules/quizzes/tests", "app/workers/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/router.py" = ["B008"]
"**/core/dependencies.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest"]
